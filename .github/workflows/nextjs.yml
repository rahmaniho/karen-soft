name: Verify Next.js

# This application uses server routes. Deploy with Vercel, not GitHub Pages.
on:
  push:
    branches: [main, arena/24c76351-karen-soft, arena/f5a82a5d-karen-soft]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser E2E and accessibility gate
        run: npm run test:e2e
      - name: SEO audit on the built site
        run: |
          npm run start -- -p 3100 > /tmp/next-start.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/a11y-routes.mjs --base http://127.0.0.1:3100 --widths 320,1440 --themes light,dark --concurrency 2
          node scripts/seo-audit.ts --base http://127.0.0.1:3100
